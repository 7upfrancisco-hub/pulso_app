<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PULSO — Olvidé mi contraseña</title>
  <link rel="stylesheet" href="/css/pulso.css">
</head>
<body>
  <header class="pulso-header">
    <a class="brand" href="/"><span class="dot"></span>PULSO</a>
    <nav><a href="/">Inicio</a></nav>
  </header>

  <main class="container">
    <h1>Recuperar contraseña</h1>
    <p class="muted">
      Ingresá tu DNI. Si tenés una Identidad PULSO registrada, te enviamos un
      email con un enlace para elegir una contraseña nueva.
    </p>

    <div id="form-alert"></div>

    <form id="forgot-form" class="card" novalidate>
      <div class="field">
        <label for="dni">DNI</label>
        <input type="text" id="dni" name="dni" required inputmode="numeric" placeholder="Ej: 38456123">
      </div>
      <button type="submit" class="btn btn-primary" id="submit-btn">Enviar enlace</button>
    </form>

    <p class="muted center mt-16">
      <a href="/login">Volver a iniciar sesión</a>
    </p>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/forgot-password.js"></script>
</body>
</html>
