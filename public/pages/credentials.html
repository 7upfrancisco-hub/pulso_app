<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PULSO — Credenciales</title>
  <link rel="stylesheet" href="/css/pulso.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#e2001a">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PULSO">
</head>
<body>
  <header class="pulso-header no-print">
    <a class="brand" href="/admin"><span class="dot"></span>PULSO</a>
    <nav><a href="/admin">Volver al panel</a></nav>
  </header>

  <main class="container container--wide">
    <div class="no-print">
      <h1>Credenciales para imprimir</h1>
      <p class="muted">
        Nombre, Código PULSO y QR de cada participante. Sin datos de salud: el
        rescatista los ve al escanear el QR o buscar el código, igual que
        siempre. Usá Ctrl+P (o el menú de compartir del celular) para
        imprimir o guardar como PDF.
      </p>
      <div class="field mt-16">
        <label for="search-input">Buscar por nombre o Código PULSO</label>
        <input type="text" id="search-input" placeholder="Ej: Sosa, PU-8F42K">
      </div>

      <div class="credentials-toolbar">
        <button type="button" class="btn btn-secondary btn-inline" id="select-all-btn">Seleccionar todo</button>
        <button type="button" class="btn btn-secondary btn-inline" id="select-none-btn">Ninguno</button>
        <button type="button" class="btn btn-primary btn-inline" id="print-btn">Imprimir seleccionadas (<span id="selected-count">0</span>)</button>
      </div>
    </div>

    <div id="credentials-alert" class="no-print"></div>

    <div id="credentials-grid" class="credentials-grid">
      <p class="muted center no-print">Cargando…</p>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/credentials.js"></script>
</body>
</html>
