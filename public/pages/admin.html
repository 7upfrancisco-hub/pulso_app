<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PULSO — Admin</title>
  <link rel="stylesheet" href="/css/pulso.css">
</head>
<body>
  <header class="pulso-header">
    <a class="brand" href="/"><span class="dot"></span>PULSO</a>
    <nav><a href="/">Inicio</a></nav>
  </header>

  <main class="container container--wide">
    <h1>Panel de administración</h1>
    <p class="muted">Vista de prueba del MVP, sin autenticación todavía.</p>

    <div class="stats-grid" id="stats-grid">
      <div class="stat-tile"><div class="stat-value">—</div><div class="stat-label">Cargando</div></div>
    </div>

    <div class="field">
      <label for="search-input">Buscar por nombre, DNI o Código PULSO</label>
      <input type="text" id="search-input" placeholder="Ej: Sosa, 38456123, PU-8F42K">
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Nombre</th>
            <th>DNI</th>
            <th>Código PULSO</th>
            <th>Grupo</th>
            <th>Última actualización</th>
          </tr>
        </thead>
        <tbody id="table-body">
          <tr><td colspan="5">Cargando…</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
