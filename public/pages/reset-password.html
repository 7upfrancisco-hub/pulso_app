<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PULSO — Elegir nueva contraseña</title>
  <link rel="stylesheet" href="/css/pulso.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#e2001a">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PULSO">
</head>
<body>
  <header class="pulso-header">
    <a class="brand" href="/"><span class="dot"></span>PULSO</a>
  </header>

  <main class="container">
    <h1>Elegí tu nueva contraseña</h1>

    <div id="form-alert"></div>

    <form id="reset-form" class="card" novalidate>
      <div class="field">
        <label for="password">Contraseña nueva</label>
        <input type="password" id="password" name="password" required minlength="6" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary" id="submit-btn">Guardar contraseña</button>
    </form>

    <p class="muted center mt-16">
      <a href="/login">Volver a iniciar sesión</a>
    </p>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/reset-password.js"></script>
</body>
</html>
