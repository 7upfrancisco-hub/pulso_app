<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PULSO — Ingresar</title>
  <link rel="stylesheet" href="/css/pulso.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#e2001a">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PULSO">
</head>
<body>
  <header class="pulso-header">
    <a class="brand" href="/"><span class="dot"></span>PULSO</a>
  </header>

  <main class="container">
    <h1>Identidad PULSO</h1>
    <p class="muted">
      Identidad de salud para eventos. La informacion es declarada por el participante:
      PULSO no es una ficha medica, no es una historia clinica y no certifica informacion medica.
    </p>

    <div id="form-alert"></div>

    <form id="login-form" class="card" novalidate>
      <div class="field">
        <label for="dni">DNI</label>
        <input type="text" id="dni" name="dni" required inputmode="numeric" placeholder="Ej: 38456123" autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary" id="submit-btn">Ingresar</button>
    </form>

    <p class="muted center mt-16">
      ¿Todavía no tenés tu Identidad PULSO? <a href="/registro">Registrate como participante</a>.
    </p>
    <p class="muted center">
      <a href="/forgot-password">¿Olvidaste tu contraseña?</a>
    </p>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
